[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evopoint-da"
version = "0.1.0"
description = "HoloShift-TBDT state-conditioned transporter displacement benchmark."
requires-python = ">=3.10"
license = { file = "LICENSE" }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pip-audit>=2.7",
]
docking = [
    "rdkit>=2023.9",
    "meeko>=0.7,<0.8",
    "vina>=1.2,<1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
